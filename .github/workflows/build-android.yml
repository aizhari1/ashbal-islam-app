name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build APK (بدون Expo token)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Install npm deps + assets
        run: |
          npm install
          npm run generate-assets
          npx expo install expo-asset expo-constants expo-file-system expo-font || true

      - name: Expo prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

      - name: Gradle assembleRelease
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          NODE_ENV: production

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" | grep -E 'release|universal' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find android -name "*.apk" | head -n 1); fi
          if [ -z "$APK" ]; then echo "No APK found"; find android -name "*.apk" || true; exit 1; fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          cp "$APK" ashbal-islam.apk
          ls -lh ashbal-islam.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashbal-islam-apk
          path: ashbal-islam.apk
          retention-days: 30
