name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Create debug keystore for signing
        run: |
          mkdir -p $HOME/.android
          if [ ! -f $HOME/.android/debug.keystore ]; then
            keytool -genkey -v -keystore $HOME/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AshbalIslam, OU=App, O=Ashbal, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Generate icons
        run: |
          pip install pillow -q
          python3 scripts/make-icons.py
          ls -la app/src/main/res/mipmap-hdpi/
          ls -la app/src/main/res/drawable/

      - name: Build signed debug APK (installable)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "DEBUG=$DEBUG_APK"
          echo "RELEASE=$RELEASE_APK"
          cp "$DEBUG_APK" dist/ashbal-islam-debug.apk
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" dist/ashbal-islam-release.apk; fi
          ls -lh dist/
          # verify zip integrity
          unzip -t dist/ashbal-islam-debug.apk | tail -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashbal-islam-apk
          path: dist/*.apk
          retention-days: 30
